<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KabuWatch">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon_v2.png">
<link rel="manifest" href="manifest.json?v=2">
<title>KabuWatch</title>
<!--
  kabu_watch の iPhone 用画面。GitHub API で data/state.json を読み、
  「買った」「売った」は GitHub Actions（kabu_watch.yml）を buy/sell コマンドで起動する。
  トークンはこの端末のブラウザ内（localStorage）だけに保存し、どこにも送らない（GitHub API 以外）。
-->
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1c1f1e;--sub:#5d6662;--line:#e2e5e3;--acc:#0f766e;--acc-ink:#fff;
  --red:#c2410c;--green:#15803d;--warn-bg:#fff7ed;--warn:#9a3412;--chip:#eef2f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--card:#1a1f1e;--ink:#eef1ef;
  --sub:#9aa5a0;--line:#2b3331;--acc:#2dd4bf;--acc-ink:#062a26;--red:#fb923c;--green:#4ade80;--warn-bg:#2a1b10;
  --warn:#fdba74;--chip:#232a28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
header{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1}
main{max-width:640px;margin:0 auto;padding:0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
h2{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.small{font-size:13px;color:var(--sub)}
.up,.small.up{color:var(--green)}.dn,.small.dn{color:var(--red)}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 14px;min-height:40px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5}
.icon{width:40px;padding:0;font-size:18px}
input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.empty{color:var(--sub);font-size:14px;padding:4px 0}
.info{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.kv span:first-child{color:var(--sub)}
.big{font-size:17px;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--sub);margin-left:4px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:var(--ink);color:var(--bg);
  border-radius:12px;padding:12px 14px;font-size:14px;display:none;z-index:9}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>KabuWatch</h1>
  <button class="icon" id="reload" aria-label="更新">↻</button>
  <button class="icon" id="gear" aria-label="設定">⚙</button>
</header>
<main id="app"></main>

<dialog id="setup">
  <h2 style="color:var(--ink);font-size:17px">はじめの設定</h2>
  <div class="small">この画面の内容はこの iPhone の中だけに保存されます。</div>
  <label for="repo">リポジトリ（ユーザー名/名前）</label>
  <input id="repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="koji2381/KabuWatch">
  <label for="token">GitHub のトークン（github_pat_ で始まる文字）</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="btns"><button id="setupCancel">閉じる</button><button class="pri" id="setupSave">保存</button></div>
</dialog>

<dialog id="trade">
  <h2 id="tTitle" style="color:var(--ink);font-size:17px"></h2>
  <div class="small" id="tHint"></div>
  <div id="tCodeWrap"><label for="tCode">銘柄コード（4桁）</label><input id="tCode" inputmode="text" autocapitalize="characters" maxlength="4"></div>
  <label for="tPrice">値段（円）<span class="small">空欄なら自動</span></label><input id="tPrice" inputmode="decimal">
  <label for="tQty">株数 <span class="small">空欄なら自動</span></label><input id="tQty" inputmode="numeric">
  <div class="btns"><button id="tCancel">やめる</button><button class="pri" id="tOk">記録する</button></div>
</dialog>

<div id="toast" role="status"></div>

<script>
const APP_VERSION = "1.5.0";   // この画面の版。変えたら kabu_watch/__init__.py の APP_VERSION と CHANGELOG.md も合わせる
const $ = s => document.querySelector(s);
const API = "https://api.github.com";
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let cfg = { repo: store.get("kw_repo", "koji2381/KabuWatch"), token: store.get("kw_token", "") };

// トークンを消えにくくする：localStorage と IndexedDB の両方に保存し、ブラウザで開いているときは
// アドレスの # 以降にも入れておく（# 以降はサーバーに送られない）。この状態で「ホーム画面に追加」すると
// アイコンのアドレスにトークンが含まれ、iPhone が保存データを消しても次に開いたとき自動で戻る。
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function hashToken() {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  try { return m ? atob(decodeURIComponent(m[1])) : ""; } catch { return ""; }
}
function setHashToken(t) {
  try { history.replaceState(null, "", location.pathname + location.search + (t ? "#k=" + encodeURIComponent(btoa(t)) : "")); } catch {}
}
function idb(mode, value) {
  return new Promise(resolve => {
    try {
      const rq = indexedDB.open("kabuwatch", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onerror = () => resolve("");
      rq.onsuccess = () => {
        const st = rq.result.transaction("kv", mode === "get" ? "readonly" : "readwrite").objectStore("kv");
        const r = mode === "get" ? st.get("token") : st.put(value, "token");
        r.onsuccess = () => resolve(mode === "get" ? (r.result || "") : true);
        r.onerror = () => resolve("");
      };
    } catch { resolve(""); }
  });
}
async function saveToken(t) {
  store.set("kw_token", t);
  await idb("put", t);
  if (!standalone) setHashToken(t);  // ホーム画面のアプリ内ではアドレスを書き換えない
  try { await navigator.storage?.persist?.(); } catch {}
}
async function restoreToken() {
  const t = cfg.token || hashToken() || await idb("get");
  if (t) { cfg.token = t; await saveToken(t); }
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
const yen = n => `${Math.round(n).toLocaleString()}円`;
function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); }

async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: `Bearer ${cfg.token}`,
    Accept: opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (r.status === 401) throw new Error("トークンが正しくないか、期限切れです（⚙ から設定し直してください）");
  if (r.status === 403 || r.status === 404) throw new Error(`見る権限がありません（${r.status}）。リポジトリ名とトークンの権限を確認してください`);
  if (!r.ok) throw new Error(`GitHub エラー ${r.status}`);
  return r.status === 204 ? null : (opts.raw ? r.text() : r.json());
}
async function readJson(path) {
  try { return JSON.parse(await gh(`/repos/${cfg.repo}/contents/${path}?ref=main&t=${Date.now()}`, { raw: true })); }
  catch (e) { if (String(e.message).includes("404")) return null; throw e; }
}
async function readText(path) {
  try { return await gh(`/repos/${cfg.repo}/contents/${path}?ref=main&t=${Date.now()}`, { raw: true }); } catch { return ""; }
}
// 改修記録（CHANGELOG.md）から直近の n 回分を取り出す：「## v1.5.0（2026-11-10）」の見出しと、その下の「- 」の行
function parseLog(text, n = 3) {
  const out = [];
  for (const line of (text || "").split(/\r?\n/)) {
    const h = line.match(/^## (v[\d.]+)（(.+?)）/);
    if (h) { if (out.length >= n) break; out.push({ ver: h[1], date: h[2], items: [] }); }
    else if (out.length && /^- /.test(line)) out.at(-1).items.push(line.slice(2));
    else if (out.length && /^  +\S/.test(line) && out.at(-1).items.length) out.at(-1).items[out.at(-1).items.length - 1] += line.trim();
  }
  return out;
}
const newer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
async function dispatch(workflow, inputs) {
  await gh(`/repos/${cfg.repo}/actions/workflows/${workflow}/dispatches`, { method: "POST",
    body: JSON.stringify({ ref: "main", ...(inputs ? { inputs } : {}) }) });
}

function openSetup() { $("#repo").value = cfg.repo; $("#token").value = cfg.token; $("#setup").showModal(); }
$("#gear").onclick = openSetup;
$("#setupCancel").onclick = () => $("#setup").close();
$("#setupSave").onclick = async () => {
  cfg.repo = $("#repo").value.trim(); cfg.token = $("#token").value.trim();
  store.set("kw_repo", cfg.repo); await saveToken(cfg.token); $("#setup").close(); load();
  if (!standalone && cfg.token) toast("保存しました。このまま「ホーム画面に追加」すると、次からトークンの入力は不要です", 7000);
};
$("#reload").onclick = () => load();

// 「買った」「売った」→ kabu_watch.yml を buy/sell で起動（入力は英数字だけ通す）
let tradeKind = "buy";
function openTrade(kind, code, hint) {
  tradeKind = kind;
  $("#tTitle").textContent = kind === "buy" ? `買ったを記録${code ? "：" + code : ""}` : `売ったを記録：${code}`;
  $("#tHint").textContent = hint || "";
  $("#tCodeWrap").style.display = code ? "none" : "block";
  $("#tCode").value = code || ""; $("#tPrice").value = ""; $("#tQty").value = "";
  $("#trade").showModal();
}
$("#tCancel").onclick = () => $("#trade").close();
$("#tOk").onclick = async () => {
  const code = $("#tCode").value.trim().toUpperCase(), price = $("#tPrice").value.trim(), qty = $("#tQty").value.trim();
  if (!/^[0-9][0-9A-Z]{3}$/.test(code)) return toast("銘柄コードは4桁で入れてください（例 1234、130A）");
  if (price && !/^\d+(\.\d+)?$/.test(price)) return toast("値段は数字で入れてください");
  if (qty && !/^\d+$/.test(qty)) return toast("株数は数字で入れてください");
  if (qty && !price) return toast("株数を入れるときは値段も入れてください");
  const cmd = [tradeKind, code, price, qty].filter(Boolean).join(" ");
  $("#tOk").disabled = true;
  try {
    await dispatch("kabu_watch.yml", { command: cmd });
    const log = JSON.parse(store.get("kw_log", "[]")); log.unshift({ cmd, at: Date.now() }); store.set("kw_log", JSON.stringify(log.slice(0, 10)));
    $("#trade").close(); toast("送信しました。1〜3分で記録され、Discord に結果が届きます", 5000);
    setTimeout(load, 1500);
  } catch (e) { toast(e.message, 6000); } finally { $("#tOk").disabled = false; }
};

// 休場日：土日 ＋ 祝日（data/holidays.json）＋ 年末年始（12/31〜1/3）。プログラム側（calendar_jp.py）と同じ決まり
let HOL = new Set();
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const day = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const md = d => `${d.getMonth() + 1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
function closedReason(d) {
  if (d.getDay() === 0 || d.getDay() === 6) return "土日";
  if (["12-31", "1-1", "1-2", "1-3"].includes(`${d.getMonth() + 1}-${d.getDate()}`)) return "年末年始";
  return HOL.has(iso(d)) ? "祝日" : "";
}
function nextTrading(d) { do { d = addDays(d, 1); } while (closedReason(d)); return d; }
function lastTrading(d) { while (closedReason(d)) d = addDays(d, -1); return d; }
const pct = (a, b) => `${a >= b ? "+" : ""}${((a / b - 1) * 100).toFixed(0)}%`;

function section(title, ...kids) { return el("section", {}, el("h2", {}, title), ...kids); }

function render(s, opt, runs, logText) {
  const app = $("#app"); app.replaceChildren();
  const names = {};
  for (const c of s.cohorts || []) for (const x of c.picks) names[x.code] = x.name;
  for (const [c, h] of Object.entries(s.holdings || {})) names[c] = h.name || names[c] || "";

  // 今日の状況（休場日・次の取引日・相場・日足の鮮度）
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const why = closedReason(today), plan = s.plan || {};
  const orderDay = s.last_bar ? nextTrading(day(s.last_bar)) : null;   // 買い候補・保有の注文を出す日
  const status = [];
  status.push(el("div", { class: "big" }, why ? `今日は休場日です（${why}）` : `${md(today)} 取引日`));
  if (why) status.push(el("div", { class: "small" }, `次の取引日は ${md(nextTrading(today))}`));
  if (plan.market) status.push(el("div", { style: "margin-top:6px" }, plan.market));
  status.push(el("div", { class: "small", style: "margin-top:6px" }, `最新の日足：${s.last_bar || "まだありません"}`));
  app.append(el("section", {}, ...status));
  // 引け後の処理（17:47ごろ）が済んでいるはずの日足より古ければ知らせる
  const expect = lastTrading(now.getHours() >= 19 && !why ? today : addDays(today, -1));
  if (s.last_bar && day(s.last_bar) < expect) app.append(el("div", { class: "note" },
    `最新の日足が ${md(day(s.last_bar))} のままです（${md(expect)} の分が届いていません）。下の「クラウドの実行状況」を確認してください。`));
  if (opt && !opt.trade_ok) app.append(el("div", { class: "note" }, "自動検証で今のルールは成績がマイナスです。買い候補は参考表示のみです（実際の購入は見送り推奨）。"));

  const pnlSpan = n => el("span", { class: n >= 0 ? "up" : "dn" }, `${n >= 0 ? "+" : ""}${Math.round(n).toLocaleString()}円`);
  const halfMode = (opt?.params?.exit_mode || "half_trail") === "half_trail";
  const tpText = h => {   // 通知と同じ言い方：半分利確のときは株数も出す
    if (h.half_done) return "利確済み（残りは逆指値で追いかけ）";
    const half = Math.floor(h.shares / 2 / 100) * 100;
    return halfMode && half ? `利確指値 ${yen(h.target)}（${half.toLocaleString()}株＝半分）` : `利確指値 ${yen(h.target)}（全株）`;
  };

  // 保有
  const hold = Object.entries(s.holdings || {});
  app.append(section(`💼 保有（${hold.length}）`,
    hold.length ? hold.map(([c, h]) => el("div", { class: "row" },
      el("div", { class: "grow" },
        el("div", { class: "name" }, `${c} ${h.name || ""}`),
        el("div", { class: "small" }, `買値 ${yen(h.fill)} × ${h.shares.toLocaleString()}株（${h.date}〜）`),
        h.last ? el("div", {}, `終値 ${yen(h.last)}　`, pnlSpan((h.last - h.fill) * h.shares),
          el("span", { class: "small" }, `（${pct(h.last, h.fill)}）`)) : null,
        h.exit_next
          ? el("div", { class: "dn", style: "font-weight:600" }, `${orderDay ? md(orderDay) : "次の取引日"}の寄付で成行売り（${h.exit_next}）`)
          : [el("div", { class: "small" }, tpText(h)), el("div", { class: "small dn" }, `逆指値 ${yen(h.stop)}（全株）`)]),
      el("button", { onclick: () => openTrade("sell", c, "値段・株数を空欄にすると、終値で全株売ったことになります") }, "売った")))
      : el("div", { class: "empty" }, "保有の記録はありません")));

  // 今日の買い候補
  const sug = Object.entries(s.suggest || {});
  const blocks = plan.blocks || [];
  app.append(section(`🔔 買い候補（${sug.length}）${orderDay ? "　" + md(orderDay) + " の注文" : ""}`,
    blocks.length ? el("div", { class: "info" }, `🔕 新規の買いは見送り：${blocks.join("・")}`) : null,
    sug.length ? sug.map(([c, x]) => el("div", { class: "row" },
      el("div", { class: "grow" },
        el("div", { class: "name" }, `${c} ${x.name || names[c] || ""}`, x.signal ? el("span", { class: "chip" }, x.signal) : null),
        el("div", {}, `指値 ${yen(x.entry)} × ${x.qty.toLocaleString()}株`, el("span", { class: "small" }, `（約${yen(x.entry * x.qty)}）`)),
        x.target && x.stop ? [el("div", { class: "small up" }, `利確 ${yen(x.target)}（${pct(x.target, x.entry)}）`),
          el("div", { class: "small dn" }, `逆指値 ${yen(x.stop)}（${pct(x.stop, x.entry)}・損失 約${yen((x.entry - x.stop) * x.qty)}）`)] : null),
      el("button", { class: "pri", onclick: () => openTrade("buy", c, "値段・株数を空欄にすると、通知の指値・株数で記録します") }, "買った")))
      : (blocks.length ? null : el("div", { class: "empty" }, "なし（無理に買わないのも戦略です）")),
    el("div", { style: "margin-top:10px" }, el("button", { onclick: () => openTrade("buy", "", "候補以外の銘柄を買ったときはこちら") }, "＋ ほかの銘柄を買った"))));

  // 今週の5銘柄
  const week = (s.cohorts || []).at(-1);
  app.append(section("👀 今週の5銘柄",
    week ? week.picks.map(x => el("div", { class: "row" }, el("div", { class: "grow" },
      el("div", { class: "name" }, `${x.code} ${x.name}`),
      el("div", { class: "small" }, `選定時 ${yen(x.price)}・トレンド ${x.trend}・RSI ${Math.round(x.rsi)}`)))) : el("div", { class: "empty" }, "まだありません")));

  // 成績
  const closed = s.paper?.closed || [], sold = s.sold || [];
  const sum = a => a.reduce((t, x) => t + x.pnl, 0);
  const winRate = a => a.length ? `・勝率${Math.round(a.filter(x => x.pnl > 0).length / a.length * 100)}%` : "";
  const paperPos = Object.keys(s.paper?.positions || {}), paperOrd = Object.keys(s.paper?.orders || {});
  const t = opt?.test;
  app.append(section("🧾 成績",
    el("div", { class: "kv" }, el("span", {}, `実際の売買（${sold.length}回${winRate(sold)}）`), pnlSpan(sum(sold))),
    el("div", { class: "kv" }, el("span", {}, `仮想売買（${closed.length}回${winRate(closed)}）`), pnlSpan(sum(closed))),
    paperPos.length || paperOrd.length ? el("div", { class: "small" },
      [paperPos.length ? `仮想で保有中：${paperPos.join("、")}` : "", paperOrd.length ? `仮想の買い注文中：${paperOrd.join("、")}` : ""].filter(Boolean).join("　")) : null,
    opt ? el("div", { class: "info" },
      el("div", {}, `自動検証（${opt.updated}）：${opt.trade_ok ? "🟢 合格" : "🔴 不合格"}`),
      t ? el("div", { class: "small" }, `選ぶときに使っていない期間（${opt.test_period}）で ${(t.total_ret * 100 >= 0 ? "+" : "") + (t.total_ret * 100).toFixed(1)}%・` +
        `最大下落 ${(t.max_dd * 100).toFixed(1)}%・${Math.round(t.trades || 0)}回`) : null,
      el("div", { class: "small" }, "過去の成績で、将来の利益を保証するものではありません。")) : null));

  // 操作と実行状況
  const log = JSON.parse(store.get("kw_log", "[]"));
  const st = r => r.status !== "completed" ? "⏳ 実行中" : (r.conclusion === "success" ? "✅ 完了" : "❌ 失敗");
  app.append(section("⚙️ クラウドの実行状況",
    runs.length ? runs.map(r => el("div", { class: "row" }, el("div", { class: "grow" },
      el("div", {}, `${st(r)}　${r.name.replace("kabu_watch ", "")}`),
      el("div", { class: "small" }, new Date(r.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))),
      el("a", { href: r.html_url, target: "_blank", rel: "noopener" }, "詳細"))) : el("div", { class: "empty" }, "まだありません"),
    log.length ? el("div", { class: "small", style: "margin-top:8px" }, "この iPhone から送った操作：" + log.slice(0, 3).map(l => l.cmd).join("、")) : null,
    el("div", { style: "margin-top:10px;display:flex;gap:8px;flex-wrap:wrap" },
      el("button", { onclick: async e => { e.target.disabled = true; try { await dispatch("kabu_watch_intraday.yml"); toast("急変チェックを始めました（急変があれば Discord に届きます）"); } catch (er) { toast(er.message, 6000); } e.target.disabled = false; } }, "今すぐ急変チェック"),
      el("button", { onclick: async e => { e.target.disabled = true; try { await dispatch("kabu_watch_morning.yml"); toast("朝の通知をもう一度送ります（1〜2分で Discord に届きます。休場日は届きません）", 5000); } catch (er) { toast(er.message, 6000); } e.target.disabled = false; } }, "朝の通知をもう一度"))));

  // 改修記録（直近3回分）
  const logs = parseLog(logText);
  if (logs.length) app.append(el("section", {}, el("details", {},
    el("summary", { style: "font-size:15px;font-weight:600;color:var(--sub)" }, `📝 改修記録（最新 ${logs[0].ver}・${logs[0].date}）`),
    logs.map(g => el("div", { style: "margin-top:10px" }, el("div", { class: "name" }, `${g.ver}（${g.date}）`),
      el("ul", { class: "small", style: "margin:4px 0 0;padding-left:18px" }, g.items.map(t => el("li", {}, t.replaceAll("`", "")))))))));

  // バージョン：この画面と、クラウドで動いているプログラム
  if (s.app_version && newer(s.app_version, APP_VERSION)) app.append(el("div", { class: "note" },
    `新しい画面（v${s.app_version}）があります。この画面は v${APP_VERSION} です。app/index.html を kabuwatch-app へアップロードしてください。`));
  app.append(el("div", { class: "small", style: "margin:16px 2px" }, "※指標に基づく目安です。注文は証券会社のアプリで行い、最終判断はご自身で。"));
  app.append(el("div", { class: "small", id: "ver", style: "margin:4px 2px 16px" },
    `KabuWatch　画面 v${APP_VERSION} ／ プログラム ${s.version ? "v" + s.version : "（次の引け後レポートから表示）"}`));
}

async function load() {
  if (!cfg.token) { $("#app").replaceChildren(section("ようこそ", el("div", {}, "右上の ⚙ から GitHub のトークンを設定してください。"))); openSetup(); return; }
  $("#reload").disabled = true;
  try {
    const [s, opt, logText, hol, runs] = await Promise.all([readJson("data/state.json"), readJson("data/params.json"), readText("CHANGELOG.md"),
      readJson("data/holidays.json").catch(() => null),   // 無くても土日・年末年始だけで動く
      gh(`/repos/${cfg.repo}/actions/runs?per_page=6`).then(j => j.workflow_runs).catch(() => [])]);
    HOL = new Set(hol?.days || []);
    render(s || {}, opt, runs, logText);
  } catch (e) {
    $("#app").replaceChildren(section("読み込めませんでした", el("div", {}, e.message)));
  } finally { $("#reload").disabled = false; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg.token) load(); });
restoreToken().then(load);
</script>
</body>
</html>
